<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido · Gestor de Proyectos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-purple-50">
  
  <div class="text-center px-4">
    <!-- Icono -->
    <div class="w-24 h-24 mx-auto bg-indigo-100 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-indigo-200/50">
      <svg class="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 13h.01M12 13h.01M16 13h.01" />
      </svg>
    </div>
    
    <!-- Título -->
    <h1 class="text-5xl md:text-6xl font-bold text-gray-800 tracking-tight mb-3">
      Gestor de Proyectos
    </h1>
    
    <!-- Línea decorativa -->
    <div class="w-20 h-1 bg-indigo-500 mx-auto rounded-full mb-4"></div>
    
    <!-- Saludo -->
    <p class="text-xl md:text-2xl text-gray-600 font-light mb-8">
      ¡Hola! Bienvenido a tu nuevo espacio de trabajo
    </p>

    <!-- Botón -->
    <button class="px-8 py-3 bg-indigo-600 text-white font-medium rounded-full shadow-lg shadow-indigo-200 hover:shadow-indigo-300 hover:bg-indigo-700 transition-all duration-200">
      Empieza ahora
    </button>
  </div>

</body>
</html>
